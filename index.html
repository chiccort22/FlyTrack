    function startPanelDrag(e) {
        const panel = document.getElementById('simulationsPanel');
        const controls = document.getElementById('map-controls');
        if (!panel) return;

        isPanelDragging = true;
        panelStartY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        panelLastY = panelStartY;
        panelVelocity = 0;

        if (panel.classList.contains('collapsed')) {
            panel.classList.remove('collapsed');
            panel.classList.add('expanded');
        }

        // Guardar una referencia fija al inicio del gesto.
        // Así la posición no se vuelve a calcular desde un panel que ya se movió.
        panelStartTop = panel.getBoundingClientRect().top;
        panelCurrentY = 0;

        panel.style.transition = 'none';
        if (controls) controls.style.transition = 'none';
        e.preventDefault();
    }

    function movePanelDrag(e) {
        if (!isPanelDragging) return;

        const panel = document.getElementById('simulationsPanel');
        if (!panel) return;

        const handle = document.querySelector('.simulations-handle');
        const handleHeight = handle ? handle.offsetHeight : 56;
        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        const deltaY = clientY - panelStartY;

        // Límites calculados contra la posición inicial fija del gesto.
        const minTop = Math.max(20, window.innerHeight - panel.offsetHeight - 20);
        const maxTop = window.innerHeight - handleHeight - 20;
        const desiredTop = panelStartTop + deltaY;
        const clampedTop = Math.min(maxTop, Math.max(minTop, desiredTop));

        panelCurrentY = clampedTop - panelStartTop;

        if (panel.classList.contains('expanded')) {
            panel.style.transform = `translate(-50%, ${panelCurrentY}px)`;
        }

        // Velocidad real entre eventos, en lugar de la distancia total acumulada.
        panelVelocity = clientY - panelLastY;
        panelLastY = clientY;

        e.preventDefault();
    }

    function endPanelDrag(e) {
        if (!isPanelDragging) return;
        isPanelDragging = false;

        const panel = document.getElementById('simulationsPanel');
        const controls = document.getElementById('map-controls');

        // Restaurar las transiciones normales al terminar el gesto.
        if (panel) panel.style.transition = '';
        if (controls) controls.style.transition = '';

        const velocityThreshold = -5;
        const distanceThreshold = -100;

        if (panelVelocity < velocityThreshold || panelCurrentY < distanceThreshold) {
            openSimulationsPanel();
        } else {
            closeSimulationsPanel();
        }

        updateControlsPosition();
    }

    // ================================================================
    // initSimulationsPanel: crea listeners y carga lista
    // ================================================================
    function initSimulationsPanel() {
        // Evitar múltiples inicializaciones
        if (initSimulationsPanel._initialized) return;
        initSimulationsPanel._initialized = true;

        // listeners para búsqueda
        const searchInput = document.getElementById('simulationsSearchInput');
        if (searchInput) {
            searchInput.addEventListener('input', () => loadSimulationsList());
            searchInput.addEventListener('focus', () => {
                const panel = document.getElementById('simulationsPanel');
                if (panel && panel.classList.contains('collapsed')) {
                    openSimulationsPanel();
                    setTimeout(() => {
                        searchInput.focus();
                    }, 300);
                }
            });
            searchInput.addEventListener('click', () => {
                const panel = document.getElementById('simulationsPanel');
                if (panel && panel.classList.contains('collapsed')) {
                    openSimulationsPanel();
                    setTimeout(() => {
                        searchInput.focus();
                    }, 300);
                }
            });
        }

        // collapsed input click => abrir panel y transferir texto
        const collapsedInput = document.getElementById('simulationsCollapsedSearchInput');
        if (collapsedInput) {
            collapsedInput.addEventListener('click', () => {
                const realSearch = document.getElementById('simulationsSearchInput');
                if (!realSearch) {
                    openSimulationsPanel();
                    return;
                }
                if (document.getElementById('simulationsPanel').classList.contains('collapsed')) {
                    openSimulationsPanel();
                }
                realSearch.removeAttribute('readonly');
                setTimeout(() => {
                    try {
                        realSearch.focus();
                        if (collapsedInput.value) {
                            realSearch.value = collapsedInput.value;
                            realSearch.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                    } catch (err) {
                        console.warn('No se pudo enfocar simulationsSearchInput:', err);
                    }
                }, 300);
            });
        }

        // Botón + usa su onclick para abrir directamente la configuración.

        // Handle dragging
        const handle = document.querySelector('.simulations-handle');
        if (handle) {
            handle.addEventListener('mousedown', startPanelDrag);
            handle.addEventListener('touchstart', startPanelDrag, {passive: false});
            window.addEventListener('mousemove', movePanelDrag);
            window.addEventListener('touchmove', movePanelDrag, {passive: false});
            window.addEventListener('mouseup', endPanelDrag);
            window.addEventListener('touchend', endPanelDrag);
        }

        // Click sobre panel collapsed area para abrir
        const collapsedBar = document.querySelector('.simulations-collapsed-bar');
        if (collapsedBar) {
            collapsedBar.addEventListener('click', (ev) => {
                openSimulationsPanel();
                const realSearch = document.getElementById('simulationsSearchInput');
                if (realSearch) {
                    setTimeout(() => { realSearch.focus(); }, 300);
                }
            });
        }

        // Inicializar lista
        loadSimulationsList();

        // Inicializar evento de guardado si no hay onclick (ya lo tienes en botón)
        const saveBtn = document.getElementById('saveSimulationBtn');
        if (saveBtn) {
            // ya tiene onclick inline; no forzamos nada
        }
    }
    
    // Funciones para modal de guardado (Opción 3)
    function openSaveModal(prefillName) {
        const modal = document.getElementById('saveModal');
        const modalInput = document.getElementById('modalSimulationName');
        if (!modal) return;
        try { console.debug('openSaveModal() called'); } catch(e) {}
        // remove hidden class and apply inline fallbacks in case CSS stacking blocks it
        modal.classList.remove('hidden');
        try {
            modal.style.position = 'fixed';
            modal.style.left = '50%';
            modal.style.top = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
            modal.style.zIndex = '99999';
            modal.style.display = 'block';
            modal.style.opacity = '1';
        } catch (e) {}
        if (prefillName) modalInput.value = prefillName;
        setTimeout(() => {
            try { modalInput.focus(); } catch (e) {}
        }, 160);
    }

    function closeSaveModal() {
        const modal = document.getElementById('saveModal');
        const modalInput = document.getElementById('modalSimulationName');
        if (!modal) return;
        modal.classList.add('hidden');
        modalInput.value = '';
    }

    function saveSimulationFromModal() {
        const modalInput = document.getElementById('modalSimulationName');
        const name = modalInput.value.trim();
        const nameField = document.getElementById('simulationName');
        if (!name) {
            alert('Por favor ingresa un nombre para la simulación.');
            try { modalInput.focus(); } catch (e) {}
            return;
        }
        if (nameField) nameField.value = name;
        // Reuse existing save logic
        saveSimulationToList();
        // feedback breve en collapsed input
        const collapsed = document.getElementById('simulationsCollapsedSearchInput');
        if (collapsed) {
            const oldBg = collapsed.style.background;
            collapsed.style.background = 'rgba(76,175,80,0.25)';
            setTimeout(() => { collapsed.style.background = oldBg; }, 600);
        }
        closeSaveModal();
    }

    // Abrir el panel de configuración (input-wrapper) para guardar desde el botón +
    function openInputWrapperForSave() {
        const inputWrapper = document.getElementById('input-wrapper');
        if (!inputWrapper) return;
        // Preferir usar toggleSection si está disponible para mantener consistencia
        if (typeof toggleSection === 'function') {
            if (inputWrapper.classList.contains('hidden')) toggleSection('input-wrapper');
        } else {
            inputWrapper.classList.remove('hidden');
        }
        // Asegurarse de cerrar el panel inferior de simulaciones
        if (typeof closeSimulationsPanel === 'function') closeSimulationsPanel();
        // Enfocar el campo de nombre si existe
        setTimeout(() => {
            const name = document.getElementById('simulationName');
            if (name) try { name.focus(); } catch (e) {}
        }, 180);
    }

    function closeInputWrapperForSave() {
        const inputWrapper = document.getElementById('input-wrapper');
        if (!inputWrapper) return;
        if (typeof toggleSection === 'function') {
            if (!inputWrapper.classList.contains('hidden')) toggleSection('input-wrapper');
        } else {
            inputWrapper.classList.add('hidden');
        }
    }
// Listeners para modal buttons
document.addEventListener('DOMContentLoaded', () => {
    const modalCancel = document.getElementById('modalCancelBtn');
    const modalSave = document.getElementById('modalSaveBtn');
    const modal = document.getElementById('saveModal');
    if (modalCancel) modalCancel.addEventListener('click', closeSaveModal);
    if (modalSave) modalSave.addEventListener('click', saveSimulationFromModal);
    // Listeners para botones dentro del panel de configuración
    const configApply = document.getElementById('configApplyBtn');
    const configCancel = document.getElementById('configCancelBtn');
    if (configApply) configApply.addEventListener('click', aplicarConfiguracionActual);
    if (configCancel) configCancel.addEventListener('click', () => {
        document.getElementById('input-wrapper')?.classList.add('hidden');
    });
    // cerrar modal al clickear fuera del contenido
    if (modal) {
        modal.addEventListener('click', (ev) => {
            if (ev.target === modal) closeSaveModal();
        });
        // ensure modal is appended to body to avoid stacking/transform issues
        try {
            if (modal.parentElement !== document.body) document.body.appendChild(modal);
        } catch (e) {
            console.warn('No se pudo mover modal al body:', e);
        }
    }
});
// Delegated click handler as a fallback in case direct binding failed
document.addEventListener('click', (ev) => {

        if (btn) {
            ev.stopPropagation();

    } catch (e) {
        console.warn('Delegated click handler error', e);
    }

let startX = 0; // Posición X inicial del toque
let currentX = 0; // Posición X actual durante el movimiento
let dragging = false; // Estado para saber si se está arrastrando
const MIN_DRAG_DISTANCE = 50; // Distancia mínima para considerar un 'swipe' (en píxeles)
const panel = document.getElementById('simulationsPanel'); // Referencia al panel
